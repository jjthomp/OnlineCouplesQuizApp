<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Us, Newlywed Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2e1a3a; --plum-deep:#20122a; --blush:#f2b6c6; --gold:#e8c07d; --cream:#faf3ec; --ink:#2b1f2e;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; min-height:100%;
    background:radial-gradient(circle at 20% 10%, #3a2249 0%, var(--plum) 45%, var(--plum-deep) 100%);
    font-family:'Karla',sans-serif; color:var(--cream);
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  .card{width:100%; max-width:540px; background:rgba(250,243,236,0.06); border:1px solid rgba(250,243,236,0.15); border-radius:18px; padding:36px 30px; backdrop-filter:blur(6px);}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:1.9rem; line-height:1.18; margin:0 0 6px;}
  h1 em{font-style:italic; color:var(--blush);}
  .sub{font-size:0.97rem; color:rgba(250,243,236,0.72); margin:0 0 24px; line-height:1.55;}
  .choices{display:flex; flex-direction:column; gap:10px;}
  .optbtn{
    text-align:left; background:rgba(0,0,0,0.18); border:1px solid rgba(250,243,236,0.18);
    border-radius:12px; padding:16px 18px; color:var(--cream); cursor:pointer; font-family:'Karla',sans-serif;
  }
  .optbtn:hover{border-color:var(--gold);}
  .optbtn .t{font-weight:700; font-size:1rem; display:block; margin-bottom:3px;}
  .optbtn .d{font-size:0.85rem; color:rgba(250,243,236,0.6);}
  button{font-family:'Karla',sans-serif; font-size:0.98rem; font-weight:700; cursor:pointer; border:none; border-radius:10px; padding:13px 20px; transition:transform .12s ease, background .15s ease;}
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--blush); color:var(--ink);}
  .btn-primary:hover{background:#f6c8d6;}
  .btn-ghost{background:transparent; color:var(--cream); border:1px solid rgba(250,243,236,0.35);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-gold:hover{background:#efcd93;}
  button:disabled{opacity:0.4; cursor:not-allowed;}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  label{display:block; font-size:0.82rem; color:var(--gold); margin:18px 0 6px;}
  input[type=text], textarea{width:100%; background:rgba(0,0,0,0.2); border:1px solid rgba(250,243,236,0.25); border-radius:10px; padding:11px 13px; color:var(--cream); font-family:'Karla',sans-serif; font-size:1rem; resize:vertical;}
  input::placeholder, textarea::placeholder{color:rgba(250,243,236,0.4);}
  .q-list{margin:18px 0; display:flex; flex-direction:column; gap:10px;}
  .q-item{background:rgba(0,0,0,0.18); border:1px solid rgba(250,243,236,0.12); border-radius:10px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:0.92rem;}
  .remove{background:none; border:none; color:var(--blush); font-size:1.1rem; padding:2px 6px;}
  .row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .badge{display:inline-block; background:rgba(232,192,125,0.15); color:var(--gold); border-radius:100px; padding:4px 12px; font-size:0.78rem; font-weight:700; margin-bottom:14px;}
  .progress{font-size:0.85rem; color:rgba(250,243,236,0.55); margin-bottom:8px;}
  .qtext{font-family:'Fraunces',serif; font-size:1.35rem; line-height:1.35; margin:6px 0 20px;}
  .reveal{margin-top:18px; padding:16px; border-radius:12px; background:rgba(232,192,125,0.12); border:1px solid rgba(232,192,125,0.35);}
  .reveal .label{font-size:0.78rem; color:var(--gold); margin-bottom:4px;}
  .reveal .answer{font-family:'Fraunces',serif; font-size:1.1rem;}
  .score-check{display:flex; gap:10px; margin-top:16px;}
  .final-score{font-family:'Fraunces',serif; font-size:3rem; margin:8px 0 4px; color:var(--gold);}
  .pair{display:flex; gap:12px; margin-top:4px; flex-wrap:wrap;}
  .pair-card{flex:1; min-width:180px; background:rgba(0,0,0,0.18); border:1px solid rgba(250,243,236,0.15); border-radius:12px; padding:14px 16px;}
  .pair-card .who{font-size:0.78rem; color:var(--gold); margin-bottom:5px;}
  .pair-card .say{font-family:'Fraunces',serif; font-size:1.05rem; line-height:1.35;}
  .codebox{width:100%; min-height:90px; font-family:monospace; font-size:0.8rem; word-break:break-all; background:rgba(0,0,0,0.25); border:1px solid rgba(250,243,236,0.25); border-radius:10px; padding:12px; color:rgba(250,243,236,0.85); margin-top:10px;}
  .hint{font-size:0.85rem; color:rgba(250,243,236,0.55); margin-top:14px; line-height:1.5;}
  .copied{color:var(--gold); font-size:0.85rem; margin-left:10px;}
  @media (max-width:420px){.card{padding:28px 20px;} h1{font-size:1.6rem;} .qtext{font-size:1.15rem;}}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
function enc(obj){
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json)));
}
function dec(str){
  const json = decodeURIComponent(escape(atob(str.trim())));
  return JSON.parse(json);
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

let state = {
  screen: 'home',
  questions: [],       // [{id,text}]
  draftQ: '',
  myName: '',
  myAnswers: {},       // {id: text}
  answerDraft: {},
  code: '',
  pasteInput: '',
  partnerName: '',
  partnerAnswers: {},
  guessCurrent: 0,
  guessScore: 0,
  guessAnswered: false,
  guessRight: null,
  guessInput: '',
  compareCurrent: 0,
  compareRevealed: false,
  compareMatches: 0,
  compareJudged: null
};

const app = document.getElementById('app');

function render(){
  const map = {
    home: renderHome,
    createQuestions: renderCreateQuestions,
    pasteQuestions: renderPasteQuestions,
    pasteAnswers: renderPasteAnswers,
    answerSelf: renderAnswerSelf,
    showCode: renderShowCode,
    guessIntro: renderGuessIntro,
    guessPlay: renderGuessPlay,
    guessEnd: renderGuessEnd,
    comparePlay: renderComparePlay,
    compareEnd: renderCompareEnd
  };
  map[state.screen]();
}

function renderHome(){
  app.innerHTML = `
    <span class="badge">Us, Newlywed Style</span>
    <h1>Answer <em>apart</em>, guess <em>together</em>.</h1>
    <p class="sub">You each privately answer the same questions about yourself, then trade a short code and try to guess what the other one said. Works even if you're in different places right now.</p>
    <div class="choices">
      <button class="optbtn" id="opt1"><span class="t">Start fresh — I'll write the questions</span><span class="d">Pick prompts, answer them yourself, get a code to send your partner.</span></button>
      <button class="optbtn" id="opt2"><span class="t">I got a question code from my partner</span><span class="d">Paste it in and answer the same prompts they did.</span></button>
      <button class="optbtn" id="opt3"><span class="t">I got my partner's answer code — let me guess</span><span class="d">Paste it in and try to guess what they said, one question at a time.</span></button>
    </div>
  `;
  document.getElementById('opt1').onclick = () => { state.screen='createQuestions'; render(); };
  document.getElementById('opt2').onclick = () => { state.screen='pasteQuestions'; render(); };
  document.getElementById('opt3').onclick = () => { state.screen='pasteAnswers'; render(); };
}

function renderCreateQuestions(){
  const list = state.questions.map((q,i)=>`
    <div class="q-item"><span>${i+1}. ${escapeHtml(q.text)}</span><button class="remove" data-i="${i}">✕</button></div>
  `).join('');
  app.innerHTML = `
    <span class="badge">Writing the questions</span>
    <h1>Prompts about <em>yourself</em>.</h1>
    <p class="sub">Both of you will answer these exact same questions. Think: favorites, habits, opinions, memories. "What's my go-to comfort food?" not "what's my partner's favorite food?"</p>
    <label for="qInput">Question</label>
    <input type="text" id="qInput" placeholder="What's my go-to comfort food?" value="${escapeHtml(state.draftQ)}">
    <div class="row"><button class="btn-gold" id="addQ">Add question</button></div>
    ${state.questions.length ? `<div class="q-list">${list}</div>` : ''}
    <div class="row">
      <button class="btn-primary" id="doneBtn" ${state.questions.length===0?'disabled':''}>Done — answer these myself</button>
      <button class="btn-ghost" id="backBtn">Back</button>
    </div>
  `;
  document.getElementById('qInput').oninput = e => state.draftQ = e.target.value;
  document.getElementById('addQ').onclick = () => {
    if(!state.draftQ.trim()) return;
    state.questions.push({id: uid(), text: state.draftQ.trim()});
    state.draftQ = ''; render(); document.getElementById('qInput').focus();
  };
  document.querySelectorAll('.remove').forEach(btn=>{
    btn.onclick = () => { state.questions.splice(Number(btn.dataset.i),1); render(); };
  });
  document.getElementById('doneBtn').onclick = () => { state.answerDraft={}; state.screen='answerSelf'; render(); };
  document.getElementById('backBtn').onclick = () => { state.screen='home'; render(); };
}

function renderPasteQuestions(){
  app.innerHTML = `
    <span class="badge">Loading their questions</span>
    <h1>Paste the code they sent you.</h1>
    <p class="sub">This just loads the question list — not their answers.</p>
    <textarea id="pasteBox" rows="4" placeholder="Paste code here">${escapeHtml(state.pasteInput)}</textarea>
    <div class="row"><button class="btn-primary" id="loadBtn">Load questions</button><button class="btn-ghost" id="backBtn">Back</button></div>
    <p class="hint" id="err"></p>
  `;
  document.getElementById('pasteBox').oninput = e => state.pasteInput = e.target.value;
  document.getElementById('backBtn').onclick = () => { state.screen='home'; render(); };
  document.getElementById('loadBtn').onclick = () => {
    try{
      const data = dec(state.pasteInput);
      if(!data.questions) throw new Error('bad');
      state.questions = data.questions;
      state.answerDraft = {};
      state.screen='answerSelf'; render();
    }catch(e){
      document.getElementById('err').textContent = "That code didn't load right — check you copied the whole thing.";
    }
  };
}

function renderAnswerSelf(){
  app.innerHTML = `
    <span class="badge">Answering privately</span>
    <h1>Your answers. No peeking, either way.</h1>
    <p class="sub">Answer honestly and quickly — your partner will be guessing these.</p>
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Your name" value="${escapeHtml(state.myName)}">
    ${state.questions.map((q,i)=>`
      <label>${i+1}. ${escapeHtml(q.text)}</label>
      <input type="text" class="ansInput" data-id="${q.id}" placeholder="Your answer" value="${escapeHtml(state.answerDraft[q.id]||'')}">
    `).join('')}
    <div class="row">
      <button class="btn-primary" id="genBtn">Generate my code</button>
      <button class="btn-ghost" id="backBtn">Back</button>
    </div>
  `;
  document.getElementById('nameInput').oninput = e => state.myName = e.target.value;
  document.querySelectorAll('.ansInput').forEach(inp=>{
    inp.oninput = e => state.answerDraft[e.target.dataset.id] = e.target.value;
  });
  document.getElementById('backBtn').onclick = () => { state.screen='home'; render(); };
  document.getElementById('genBtn').onclick = () => {
    if(!state.myName.trim()){ document.getElementById('nameInput').focus(); return; }
    const missing = state.questions.some(q => !(state.answerDraft[q.id]||'').trim());
    if(missing){ alert('Answer every question before generating your code.'); return; }
    state.myAnswers = {...state.answerDraft};
    state.code = enc({v:1, name: state.myName.trim(), questions: state.questions, answers: state.myAnswers});
    state.screen='showCode'; render();
  };
}

function renderShowCode(){
  app.innerHTML = `
    <span class="badge">Your code is ready</span>
    <h1>Send this to your partner.</h1>
    <p class="sub">Text or message this code to them, along with this page's link. When they've done the same, paste their code back here to start guessing.</p>
    <textarea class="codebox" id="codeOut" readonly rows="5">${state.code}</textarea>
    <div class="row">
      <button class="btn-gold" id="copyBtn">Copy code</button><span class="copied" id="copiedMsg"></span>
    </div>
    <div class="row">
      <button class="btn-primary" id="toGuess">I have their code — start guessing</button>
    </div>
    <div class="row">
      <button class="btn-ghost" id="homeBtn">Back to start</button>
    </div>
  `;
  document.getElementById('copyBtn').onclick = async () => {
    try{ await navigator.clipboard.writeText(state.code); }
    catch(e){ document.getElementById('codeOut').select(); document.execCommand('copy'); }
    document.getElementById('copiedMsg').textContent = 'Copied!';
    setTimeout(()=>{ const m=document.getElementById('copiedMsg'); if(m) m.textContent=''; },2000);
  };
  document.getElementById('toGuess').onclick = () => { state.pasteInput=''; state.screen='pasteAnswers'; render(); };
  document.getElementById('homeBtn').onclick = () => { state.screen='home'; render(); };
}

function renderPasteAnswers(){
  app.innerHTML = `
    <span class="badge">Loading their answers</span>
    <h1>Paste your partner's code.</h1>
    <p class="sub">It's encoded gibberish either way — but no fair decoding it yourself before you play.</p>
    <textarea id="pasteBox" rows="4" placeholder="Paste their code here">${escapeHtml(state.pasteInput)}</textarea>
    <div class="row"><button class="btn-primary" id="loadBtn">Start guessing</button><button class="btn-ghost" id="backBtn">Back</button></div>
    <p class="hint" id="err"></p>
  `;
  document.getElementById('pasteBox').oninput = e => state.pasteInput = e.target.value;
  document.getElementById('backBtn').onclick = () => { state.screen='home'; render(); };
  document.getElementById('loadBtn').onclick = () => {
    try{
      const data = dec(state.pasteInput);
      if(!data.questions || !data.answers || !data.name) throw new Error('bad');
      state.questions = data.questions;
      state.partnerAnswers = data.answers;
      state.partnerName = data.name;
      state.screen='guessIntro'; render();
    }catch(e){
      document.getElementById('err').textContent = "That code didn't load right — check you copied the whole thing.";
    }
  };
}

function haveOwnAnswers(){
  return state.questions.length > 0 && state.questions.every(q => (state.myAnswers[q.id]||'').trim());
}

function renderGuessIntro(){
  const canCompare = haveOwnAnswers();
  app.innerHTML = `
    <span class="badge">${state.questions.length} question${state.questions.length===1?'':'s'} loaded</span>
    <h1>Two ways to play with ${escapeHtml(state.partnerName)}'s answers.</h1>
    <label for="myGuesserName">Your name</label>
    <input type="text" id="myGuesserName" placeholder="Your name" value="${escapeHtml(state.myName)}">
    <div class="choices" style="margin-top:20px;">
      <button class="optbtn" id="modeGuess"><span class="t">Guess mode</span><span class="d">See the question, guess what they said, then reveal and self-score.</span></button>
      <button class="optbtn" id="modeCompare"><span class="t">Compare mode</span><span class="d">${canCompare ? "You both already answered truthfully — see them side by side, no guessing." : "Requires you to have answered these same questions yourself first."}</span></button>
    </div>
  `;
  document.getElementById('myGuesserName').oninput = e => state.myName = e.target.value;
  document.getElementById('modeGuess').onclick = () => {
    state.guessCurrent=0; state.guessScore=0; state.guessAnswered=false; state.guessRight=null;
    state.screen='guessPlay'; render();
  };
  document.getElementById('modeCompare').onclick = () => {
    if(!canCompare){
      state.answerDraft = {...state.myAnswers};
      state.screen='answerSelf'; render();
      return;
    }
    state.compareCurrent=0; state.compareMatches=0; state.compareRevealed=false; state.compareJudged=null;
    state.screen='comparePlay'; render();
  };
}

function renderComparePlay(){
  const q = state.questions[state.compareCurrent];
  const mine = state.myAnswers[q.id] || '(no answer)';
  const theirs = state.partnerAnswers[q.id] || '(no answer)';
  app.innerHTML = `
    <div class="progress">Question ${state.compareCurrent+1} of ${state.questions.length} · comparing with ${escapeHtml(state.partnerName)}</div>
    <div class="qtext">${escapeHtml(q.text)}</div>
    ${!state.compareRevealed ? `
      <div class="row"><button class="btn-gold" id="revealBtn">Reveal both answers</button></div>
    ` : `
      <div class="pair">
        <div class="pair-card"><div class="who">${escapeHtml(state.myName||'You')}</div><div class="say">${escapeHtml(mine)}</div></div>
        <div class="pair-card"><div class="who">${escapeHtml(state.partnerName)}</div><div class="say">${escapeHtml(theirs)}</div></div>
      </div>
      ${state.compareJudged === null ? `
        <p class="sub" style="margin:14px 0 0;">Same energy?</p>
        <div class="score-check">
          <button class="btn-primary" id="markSame">We matched ✓</button>
          <button class="btn-ghost" id="markDiff">Different ✕</button>
        </div>
      ` : `
        <div class="row"><button class="btn-primary" id="nextQ">${state.compareCurrent+1 < state.questions.length ? 'Next question' : 'See the recap'}</button></div>
      `}
    `}
  `;
  if(!state.compareRevealed){
    document.getElementById('revealBtn').onclick = () => { state.compareRevealed=true; state.compareJudged=null; render(); };
  } else if(state.compareJudged === null){
    document.getElementById('markSame').onclick = () => { state.compareJudged=true; state.compareMatches++; render(); };
    document.getElementById('markDiff').onclick = () => { state.compareJudged=false; render(); };
  } else {
    document.getElementById('nextQ').onclick = () => {
      if(state.compareCurrent+1 < state.questions.length){
        state.compareCurrent++; state.compareRevealed=false; state.compareJudged=null; render();
      } else { state.screen='compareEnd'; render(); }
    };
  }
}

function renderCompareEnd(){
  const total = state.questions.length;
  app.innerHTML = `
    <span class="badge">Recap</span>
    <h1>You and ${escapeHtml(state.partnerName)} matched on ${state.compareMatches} of ${total}.</h1>
    <p class="sub">Compare mode isn't about winning — just about noticing where you overlap and where you're pleasantly different.</p>
    <div class="row">
      <button class="btn-primary" id="again">Go through them again</button>
      <button class="btn-ghost" id="homeBtn">Back to start</button>
    </div>
  `;
  document.getElementById('again').onclick = () => {
    state.compareCurrent=0; state.compareMatches=0; state.compareRevealed=false; state.compareJudged=null;
    state.screen='comparePlay'; render();
  };
  document.getElementById('homeBtn').onclick = () => { state.screen='home'; render(); };
}

function renderGuessPlay(){
  const q = state.questions[state.guessCurrent];
  const realAnswer = state.partnerAnswers[q.id] || '(no answer given)';
  app.innerHTML = `
    <div class="progress">Question ${state.guessCurrent+1} of ${state.questions.length} · guessing ${escapeHtml(state.partnerName)}</div>
    <div class="qtext">${escapeHtml(q.text)}</div>
    ${!state.guessAnswered ? `
      <input type="text" class="answer-box" id="guessBox" placeholder="Your guess">
      <div class="row"><button class="btn-gold" id="revealBtn">Reveal their answer</button></div>
    ` : `
      <div class="reveal"><div class="label">${escapeHtml(state.partnerName)} actually said</div><div class="answer">${escapeHtml(realAnswer)}</div></div>
      ${state.guessRight === null ? `
        <p class="sub" style="margin:14px 0 0;">Close enough to count?</p>
        <div class="score-check">
          <button class="btn-primary" id="markRight">Nailed it ✓</button>
          <button class="btn-ghost" id="markWrong">Nope ✕</button>
        </div>
      ` : `
        <div class="row"><button class="btn-primary" id="nextQ">${state.guessCurrent+1 < state.questions.length ? 'Next question' : 'See final score'}</button></div>
      `}
    `}
  `;
  if(!state.guessAnswered){
    document.getElementById('revealBtn').onclick = () => { state.guessAnswered=true; state.guessRight=null; render(); };
  } else if(state.guessRight === null){
    document.getElementById('markRight').onclick = () => { state.guessRight=true; state.guessScore++; render(); };
    document.getElementById('markWrong').onclick = () => { state.guessRight=false; render(); };
  } else {
    document.getElementById('nextQ').onclick = () => {
      if(state.guessCurrent+1 < state.questions.length){
        state.guessCurrent++; state.guessAnswered=false; state.guessRight=null; render();
      } else { state.screen='guessEnd'; render(); }
    };
  }
}

function renderGuessEnd(){
  const total = state.questions.length;
  const pct = Math.round((state.guessScore/total)*100);
  let line = "A solid showing.";
  if(pct === 100) line = "Flawless. You two are disgustingly in sync.";
  else if(pct >= 75) line = "You've clearly been paying attention.";
  else if(pct >= 40) line = "Room to grow — in the best way.";
  else line = "Might be time for a few more late-night talks.";
  app.innerHTML = `
    <span class="badge">Final score</span>
    <h1>${escapeHtml(state.myName || 'You')}, here's how you did guessing ${escapeHtml(state.partnerName)}.</h1>
    <div class="final-score">${state.guessScore} / ${total}</div>
    <p class="sub">${line}</p>
    <div class="row">
      <button class="btn-primary" id="again">Guess again from the start</button>
      <button class="btn-ghost" id="homeBtn">Back to start</button>
    </div>
  `;
  document.getElementById('again').onclick = () => {
    state.guessCurrent=0; state.guessScore=0; state.guessAnswered=false; state.guessRight=null;
    state.screen='guessPlay'; render();
  };
  document.getElementById('homeBtn').onclick = () => { state.screen='home'; render(); };
}

render();
</script>
</body>
</html>
